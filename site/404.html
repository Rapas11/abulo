<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Abulo</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0e0e0f" />
    <link rel="icon" href="__BASE__/assets/icon.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(700px 420px at 70% -10%, rgba(255, 122, 0, 0.18), transparent 65%), #0e0e0f;
        color: #f2f2f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        padding: 24px;
      }
      main { max-width: 440px; text-align: center; }
      .code {
        font: 600 64px/1 ui-monospace, Menlo, Consolas, monospace;
        color: #ff7a00;
        letter-spacing: -0.04em;
      }
      h1 { margin: 18px 0 8px; font-size: 24px; letter-spacing: -0.02em; }
      p { margin: 0 0 26px; color: #8e8e93; font-size: 15px; line-height: 1.6; }
      .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 46px;
        padding: 0 20px;
        border-radius: 13px;
        font-size: 14.5px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid transparent;
      }
      .primary { background: #ff7a00; color: #121212; }
      .ghost { border-color: #2c2c2e; color: #f2f2f7; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>This page isn’t part of Abulo</h1>
      <p>
        The link may be old or mistyped. Head back to the landing page, or jump straight into
        the web app.
      </p>
      <div class="row">
        <a class="primary" href="__BASE__/">Back to Abulo</a>
        <a class="ghost" href="__BASE__/app/">Open the web app</a>
      </div>
    </main>
    <script>
      // A deep link inside the app that the host could not resolve: boot the app
      // at its root instead of dead-ending here. The original path is kept so
      // the app can go straight back to it (static hosts have no fallback).
      if (location.pathname.indexOf('/app/') !== -1) {
        try {
          sessionStorage.setItem(
            'abulo:deep-link',
            location.pathname + location.search + location.hash,
          );
        } catch (e) {}
        location.replace('__BASE__/app/');
      }
    </script>
  </body>
</html>
